<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    window.TrelloPowerUp.initialize({
      
      // 1. Creates the Calendar button at the top of your board
      'board-buttons': function(t, options) {
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/2370/2370264.png',
          text: 'Time Grid Calendar',
          condition: 'always',
          callback: function(t) {
            // Opens your calendar.html file in a full-screen modal
            return t.modal({
              title: 'Time Grid Calendar',
              url: './calendar.html',
              fullscreen: true
            });
          }
        }];
      },

      // 2. Creates the custom settings button on the back of every card
      'card-buttons': function(t, options) {
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/61/61053.png',
          text: 'Calendar Settings', // Updated text
          callback: function(t) {
            return t.popup({
              title: 'Calendar Settings',
              url: './color.html',
              height: 300 // Increased height to fit the new time pickers
            });
          }
        }];
      }
    });
  </script>
</body>
</html>
