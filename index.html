<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    window.TrelloPowerUp.initialize({
      
      // 1. CHANGED: Now uses 'board-buttons' instead of 'board-views'
      'board-buttons': function(t, options) {
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/2370/2370264.png',
          text: 'Time Grid Calendar',
          condition: 'always',
          callback: function(t) {
            // Opens your calendar.html file in a full-screen modal
            return t.modal({
              title: 'Time Grid Calendar',
              url: './calendar.html',
              fullscreen: true
            });
          }
        }];
      },

      // 2. This stays exactly the same as before
      'card-buttons': function(t, options) {
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/61/61053.png',
          text: 'Set Calendar Color',
          callback: function(t) {
            return t.popup({
              title: 'Choose Event Color',
              url: './color.html',
              height: 150
            });
          }
        }];
      }
    });
  </script>
</body>
</html>
