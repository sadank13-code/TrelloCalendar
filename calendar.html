<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <!-- Load FullCalendar open-source library -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    body { margin: 0; padding: 15px; font-family: -apple-system, sans-serif; background: #fff;}
    #calendar { height: 90vh; }
  </style>
</head>
<body>
  <div id="calendar"></div>
  <script>
    const t = window.TrelloPowerUp.iframe();
    
    t.render(function() {
      // 1. Get all cards with their native Trello start/due times
      t.cards('id', 'name', 'start', 'due', 'url').then(function(cards) {
        
        // 2. Fetch the custom color data we stored on each card
        Promise.all(cards.map(c => t.get(c.id, 'shared', 'customColor')
          .then(color => ({...c, customColor: color}))))
          .then(cardsWithColor => {
            
            // 3. Format the data for FullCalendar
            const events = cardsWithColor
              .filter(c => c.start && c.due) // Require both times to be a time block
              .map(c => ({
                id: c.id,
                title: c.name,
                start: c.start,
                end: c.due,
                url: c.url,
                // Apply the custom color, or default to Trello Blue
                backgroundColor: c.customColor || '#0079bf',
                borderColor: c.customColor || '#0079bf'
              }));
            
            // 4. Render the Time Grid
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
              initialView: 'timeGridWeek',
              slotDuration: '00:30:00', // Forces the 30-minute scale
              expandRows: true,         // Fills the screen vertically
              eventOverlap: true,       // Renders overlapping cards side-by-side automatically
              events: events,
            });
            calendar.render();
        });
      });
    });
  </script>
</body>
</html>
