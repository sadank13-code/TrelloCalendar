<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 10px; text-align: center; margin: 0;}
    label { display: block; margin-bottom: 10px; font-weight: bold; color: #172b4d; }
    /* Styles the native color wheel */
    input[type="color"] { width: 100%; height: 50px; border: none; cursor: pointer; margin-bottom: 15px; padding: 0; }
    /* Styles the save button */
    button { width: 100%; padding: 10px; background: #0079bf; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; }
    button:hover { background: #026aa7; }
  </style>
</head>
<body>
  
  <label for="colorPicker">Select Event Color</label>
  <input type="color" id="colorPicker" value="#0079bf">
  <button onclick="saveColor()">Save to Calendar</button>
  
  <script>
    const t = window.TrelloPowerUp.iframe();
    
    // Check if the card already has a color saved, and load it into the picker
    t.get('card', 'shared', 'customColor').then(function(savedColor) {
      if (savedColor) {
        document.getElementById('colorPicker').value = savedColor;
      }
    });

    function saveColor() {
      // Get whatever hex color the user picked from the wheel
      const hexValue = document.getElementById('colorPicker').value;
      
      // Save it to Trello, then close
      t.set('card', 'shared', 'customColor', hexValue)
       .then(function() {
         t.closePopup();
       });
    }
  </script>
</body>
</html>
