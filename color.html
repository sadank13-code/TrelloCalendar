<!DOCTYPE html>
<html>
<head>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; margin: 0;}
    label { display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #172b4d;}
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 3px; font-family: inherit;}
    input[type="color"] { height: 40px; padding: 0; cursor: pointer; border: none; }
    button { width: 100%; padding: 10px; background: #0079bf; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; margin-top: 5px;}
  </style>
</head>
<body>
  
  <label>Start Date & Time</label>
  <input type="datetime-local" id="startDateTime">

  <label>End Date & Time</label>
  <input type="datetime-local" id="endDateTime">

  <label>Event Color</label>
  <input type="color" id="colorPicker" value="#0079bf">
  
  <button onclick="saveSettings()">Save to Calendar</button>
  
  <script>
    const t = window.TrelloPowerUp.iframe();
    
    // Load previously saved independent dates
    t.get('card', 'shared').then(function(data) {
      if (data) {
        if (data.customStart) document.getElementById('startDateTime').value = data.customStart;
        if (data.customEnd) document.getElementById('endDateTime').value = data.customEnd;
        if (data.customColor) document.getElementById('colorPicker').value = data.customColor;
      }
    });

    function saveSettings() {
      t.set('card', 'shared', {
        customStart: document.getElementById('startDateTime').value,
        customEnd: document.getElementById('endDateTime').value,
        customColor: document.getElementById('colorPicker').value
      }).then(function() {
        t.closePopup();
      });
    }
  </script>
</body>
</html>
